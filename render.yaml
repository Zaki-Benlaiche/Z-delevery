# Render Blueprint — يُعدّ كل الخدمات بنقرة واحدة
# اقرأ: https://render.com/docs/blueprint-spec
#
# الاستخدام:
# 1) سجّل في https://render.com بـ GitHub
# 2) New → Blueprint → اختر مستودع Z-delevery
# 3) Render يقرأ هذا الملفّ ويُنشئ الخدمات تلقائياً
# 4) أكمل بإضافة قيم secrets المُعلّمة sync: false

services:
  - type: web
    name: zdelivry-api
    runtime: docker
    plan: free
    region: frankfurt   # الأقرب للجزائر
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false            # مُدارة يدوياً في لوحة Render (قاعدة Z-delevery2) — السرّ لا يُوضع في git
                               # ملاحظة: قاعدة Render المجانية تنتهي كل ~30 يوماً؛ عند انتهائها أنشئ قاعدة جديدة وحدّث هذه القيمة
      - key: REDIS_URL
        value: memory://       # بدون Redis في النشر المجاني — نستخدم تخزيناً داخل الذاكرة
      - key: DEBUG
        value: "false"
      - key: OTP_DEV_MODE
        value: "true"          # ابقِها true حتى تربط مزوّد SMS
      - key: ALLOW_ORIGINS
        value: "*"             # ضيّقها بعد deploy الويب
      - key: SECRET_KEY
        generateValue: true    # Render يولّد قيمة قوية تلقائياً
      - key: ADMIN_PHONES
        sync: false            # تُكتَب يدوياً في لوحة Render (لتجنّب وضعها في git)

# ملاحظة: قاعدة البيانات لم تعد مُدارة عبر هذا الـ blueprint (تُنشأ يدوياً في لوحة Render
# لأن القاعدة المجانية تنتهي كل ~30 يوماً). يُضبط DATABASE_URL يدوياً (sync:false أعلاه).
